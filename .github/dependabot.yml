version: 2

updates:
  # Configure Dependabot updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Configure Dependabot updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
